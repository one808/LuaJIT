# .github/workflows/sync-and-build.yml
name: Sync upstream LuaJIT & Build

on:
  schedule:
    - cron: '0 8 * * *'       # 每天 UTC 08:00（北京时间 16:00）
  workflow_dispatch:            # 支持手动触发

permissions:
  contents: write               # 需要 push 权限

env:
  UPSTREAM_REPO: LuaJIT/LuaJIT
  UPSTREAM_BRANCH: v2.1
  LOCAL_BRANCH: v2.1

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    outputs:
      new_commits: ${{ steps.check.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LOCAL_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true

      - name: Fetch upstream
        run: git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date ($LOCAL)"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            COMMITS=$(git rev-list HEAD..upstream/${{ env.UPSTREAM_BRANCH }} --count)
            echo "🆕 Found $COMMITS new commit(s)"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_new == 'true'
        run: |
          git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit
          git push

  build:
    name: Build LuaJIT (${{ matrix.build_name }})
    needs: sync
    if: needs.sync.outputs.new_commits == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_name: Linux x86_64
          - os: macos-latest
            build_name: macOS arm64
          - os: windows-latest
            build_name: Windows x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.LOCAL_BRANCH }}

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "Building: ${{ matrix.build_name }}"
          make -j$(sysctl -n hw.logicalcpu 2>/dev/null || nproc) PREFIX=${{ github.workspace }}/install

      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: make install PREFIX=${{ github.workspace }}/install

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ${{ github.workspace }}/install/bin/luajit -e "
            print('LuaJIT version: ' .. jit.version)
            print('OK: LuaJIT built successfully on ${{ matrix.build_name }}')
          "

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo "Building: ${{ matrix.build_name }}
          cd src
          call msvcbuild.bat
          if errorlevel 1 exit /b 1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          src\luajit.exe -e "print('LuaJIT version: ' .. jit.version); print('OK: LuaJIT built successfully on ${{ matrix.build_name }}')"

      - name: Upload artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: luajit-${{ matrix.os }}
          path: ${{ github.workspace }}/install/
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: luajit-windows-latest
          path: |
            src/luajit.exe
            src/lua51.dll
            src/lua51.lib
          retention-days: 7
